<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Let Me Go 舞台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Monoton&family=Pacifico&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/ui.css" />
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="loading" class="loading">正在生成场景…</div>
    <div id="ui">
      <header class="top">
        <div class="title">
          <b>大肥鱼 · Let Me Go</b>
          <span>MMD 背景场景预览</span>
        </div>
        <div class="section" id="section">intro</div>
        <nav class="themes" id="themes" aria-label="场景主题"></nav>
        <nav class="views" id="views"></nav>
      </header>
      <div class="lyric" id="lyric"></div>
      <div id="playerHud" class="player-hud" hidden></div>
      <div id="importPanel" class="import-panel" hidden></div>
      <footer class="bar">
        <button id="play" class="play" title="播放 / 暂停（P）">▶</button>
        <span id="time" class="time">0:00.0</span>
        <div class="scrub">
          <div class="marks" id="marks"></div>
          <input id="seek" type="range" min="0" max="127.15" step="0.01" value="0" aria-label="歌曲进度" />
        </div>
        <button id="settingsBtn" class="gear" title="设置" aria-label="设置" aria-expanded="false">⚙</button>
      </footer>
      <section id="settings" class="settings" hidden aria-label="设置">
        <h3>场景</h3>
        <label class="row"><span>按段落切场景</span><input type="checkbox" id="auto" /></label>
        <label class="row"><span>漫游</span><input type="checkbox" id="tour" /></label>
        <label class="row"><span>歌词</span><input type="checkbox" id="showLyric" checked /></label>
        <h3>镜头与画面</h3>
        <label class="row"><span>运镜</span>
          <select id="cam" title="blend 版 = v2c 的运镜；手动 = 右上角机位、WASD 飞">
            <option value="blend" selected>blend 版</option>
            <option value="manual">手动</option>
          </select></label>
        <label class="row"><span>渲染管线</span>
          <select id="pipe" title="web 版 = 网页原后期；blend 版 = v2c 的 post_final 合成；无阴影 = 角色不做明暗">
            <option value="web" selected>web 版</option>
            <option value="blend">blend 版</option>
            <option value="blend-flat">blend 版 · 无阴影</option>
            <option value="simple">简洁</option>
          </select></label>
        <label class="row"><span>画质</span>
          <select id="quality">
            <option value="low">流畅</option>
            <option value="high" selected>高</option>
            <option value="ultra">极致</option>
          </select></label>
        <h3>角色</h3>
        <label class="row"><span>模型</span>
          <select id="model" title="blend 版 = v2c 三渲二角色">
            <option value="blend" selected>blend 版</option>
            <option value="ref">身高参考</option>
            <option value="hidden">隐藏</option>
          </select></label>
        <label class="row"><span>控制</span>
          <select id="ctrlMode" title="跟随舞蹈：按 v2c 舞蹈动作；自由控制：WASD / 空格 / Shift，双击空格飞行，V 切视角">
            <option value="dance" selected>跟随舞蹈</option>
            <option value="free">自由控制</option>
          </select></label>
        <label class="row"><span>视角</span>
          <select id="viewMode" title="自由控制时的镜头（V 键循环切换，第三人称可用滚轮调远近）">
            <option value="fp" selected>第一人称</option>
            <option value="back">第三人称（背后）</option>
            <option value="front">第三人称（正面）</option>
          </select></label>
        <label class="row"><span>头发裙摆</span>
          <select id="hairMode" title="物理 = 弹簧骨实时计算；K帧 = 动画里写好的关键帧">
            <option value="phys" selected>物理</option>
            <option value="key">K 帧</option>
          </select></label>
        <h3>自由控制的动作</h3>
        <label class="row"><span>动作风格</span>
          <select id="moveStyle" title="缺的动作用 Motifect 补">
            <option value="girl" selected>少女 MMD</option>
            <option value="hand">手搓</option>
            <option value="ual">Quaternius</option>
            <option value="motifect">Motifect</option>
            <option value="import">导入</option>
          </select></label>
        <div class="row"><span>自行导入</span><button id="importBtn" title=".vmd .vrma .bvh .fbx .glb（只存在本机浏览器，不上传）">导入动作…</button></div>
        <div class="row" id="fileRow" hidden><span>音频</span><label class="file" id="fileLabel">选择 mp3<input type="file" id="file" accept="audio/*" /></label></div>
      </section>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
